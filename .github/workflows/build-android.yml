name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_name:
        description: '自定义版本号（留空则自动按日期生成）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: 构建内嵌 Web 管理后台前端
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 计算构建版本号
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.$(date +%Y%m%d%H%M)"
          fi
          VERSION_CODE="${{ github.run_number }}"
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "构建版本: ${VERSION} (code: ${VERSION_CODE})"

      - name: 交叉编译 Android Go 核心（arm64-v8a & armeabi-v7a）
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a

          echo "编译 arm64-v8a ..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.name }}" \
            -o android/app/src/main/jniLibs/arm64-v8a/libvideoserver.so .

          echo "编译 armeabi-v7a ..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
            go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.name }}" \
            -o android/app/src/main/jniLibs/armeabi-v7a/libvideoserver.so .

          ls -lh android/app/src/main/jniLibs/*/libvideoserver.so

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 解码自定义 Release 签名证书（若已配置 Secrets）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "已启用自定义 Release 签名证书"
          else
            echo "未配置自定义签名证书，将使用默认签名构建可直接安装的 APK"
          fi

      - name: 编译 Android Release APK
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: 整理输出 APK 文件名
        run: |
          mkdir -p release-apks
          VER="${{ steps.ver.outputs.name }}"
          for f in android/app/build/outputs/apk/release/*.apk; do
            base="$(basename "$f")"
            out="release-apks/video-server-${VER}-${base#app-}"
            cp "$f" "$out"
          done
          ls -lh release-apks/

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: video-server-android-${{ steps.ver.outputs.name }}
          path: release-apks/*.apk
          retention-days: 30

      - name: 标签触发时自动发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
